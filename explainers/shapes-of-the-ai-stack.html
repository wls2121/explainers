onitors.",typicalVendors:["dbt tests","Great Expectations","Monte Carlo","Soda","Elementary"]},{id:"orc",name:"Orchestration & DAG Scheduler",category:"Workflow",description:"Dependency graph execution, cron triggers, retry backoffs, and sensor alerts.",typicalVendors:["Dagster","Apache Airflow","Prefect","dbt Cloud Scheduler"]},{id:"srv",name:"Serving & Query Engines",category:"Query Compute",description:"Distributed analytical SQL engines serving low-latency interactive queries.",typicalVendors:["Snowflake","BigQuery","Databricks SQL","DuckDB","ClickHouse"]},{id:"acl",name:"Access Control & IAM",category:"Security",description:"Column-level masking, RBAC policies, row-level filtering, and credential tokens.",typicalVendors:["Immuta","Privacera","AWS IAM","Okta","OpenFGA"]},{id:"obs",name:"Observability & Lineage Graph",category:"Governance",description:"End-to-end DAG lineage, SLA tracking, incident root-cause analysis, and audit trails.",typicalVendors:["Monte Carlo","Synq","Metaplane","OpenLineage","CastorDoc"]},{id:"bi",name:"BI, Notebooks & Visual Apps",category:"Consumption",description:"Visual canvases, interactive dashboards, notebooks, and operational reverse-ETL.",typicalVendors:["Hex","Looker","Tableau","Metabase","Evidence","Preset"]}],It=[{id:"inf",name:"1. Inference",shortDefinition:"A model calculates probability distributions to propose the next token or tool invocation.",deepDescription:"The compute raw-material. Can be a proprietary frontier model (Claude 3.7 Sonnet, GPT-4.5, Gemini 2.5 Pro) or fine-tuned open weights (Llama 3, DeepSeek R1). Treated either as a differentiated cognitive center or an interchangeable utility like electricity.",whyContested:"Model providers want inference to be the center of gravity; agent frameworks treat it as swappable commodity; workflow engines treat it as an untrusted, flakey network call.",analogy:"The engine cylinders firing (pure mechanical output)."},{id:"ctx",name:"2. Context",shortDefinition:"The grounding truth: schemas, metric semantics, past state, domain rules, workspace guides.",deepDescription:"What the agent actually knows prior to reasoning. Includes table schemas, dbt descriptions, metric grain rules, workspace guidelines, episodic memory, and trusted endorsements.",whyContested:"Data teams argue quality is 90% context engineering; model providers bundle context into proprietary context windows; agent engineering platforms outsource it entirely to external databases.",analogy:"The navigation charts, road signs, and physics laws."},{id:"act",name:"3. Action & Authority",shortDefinition:"The tools the agent may invoke, and the cryptographic identity / permissions under which it acts.",deepDescription:"The boundary where reasoning meets mutation. Includes MCP servers, REST tool definitions, sandbox runtimes, OAuth token delegation, role-based tool gating, and step-level approval gates.",whyContested:"Tool-plane platforms (MCP, Runlayer, Arcade) say the loop is trivial but authority is the only security-auditable perimeter. Agent frameworks treat tools as mere JSON function schemas.",analogy:"The steering wheel, pedals, and driver’s license credential."},{id:"rec",name:"4. Record & Telemetry",shortDefinition:"The immutable trace of prompts, tool calls, token usage, latency, intermediate outputs, and state diffs.",deepDescription:"The system of record. Every step taken by the agent is logged with deterministic timestamps, parent-child spans, token economics, and error payloads.",whyContested:"Observability platforms (LangSmith, Braintrust, Arize) bet that a multi-year archive of traces is the single most sticky asset a company creates, making it the true manifest of the agent stack.",analogy:"The flight data recorder (black box) documenting every micro-maneuver."},{id:"jud",name:"5. Judgment & Evals",shortDefinition:"The scoring function determining if the agent’s response or execution was accurate, safe, and aligned.",deepDescription:"Quality gates, LLM-as-a-judge scorers, golden regression datasets, unit tests on output schemas, and human-in-the-loop review queues.",whyContested:"Without evals, teams cannot ship model updates without regressions; yet workflow engines and local harnesses have zero concept of subjective semantic quality.",analogy:"The driving test examiner and safety inspection certificate."}],kt=[{id:"shape-1",name:"Agent Engineering Platform",tagline:"Build → Prove → Run with the Trace as System of Record",paradigm:"Lifecycle-centric observability & graph execution",heroQuote:'"You cannot improve or safely ship what you cannot trace, evaluate, and regression-test across prompt iterations."',exemplars:["LangChain / LangGraph","LangSmith","Braintrust","Arize Phoenix","Helicone"],runtimeStance:"LangGraph / LangSmith Deployment provides graph state machines, state checkpointing, and time-travel debugging.",missingHole:"Context & Domain Semantics are completely absent — outsourced to whatever data stack or vector database you bring.",whyTheyWin:"The accumulated trace history and golden eval dataset becomes an irreplaceable moat. Migrating 2 years of traces is practically impossible.",whyTheyFail:"If frontier model APIs become autonomous enough that multi-step prompt engineering graphs are obsolete, the runtime layer evaporates into simple API calls.",artifactProduced:"The Trace & Eval Benchmark (run_id → prompt diff → span graph → score).",ownershipProfile:{mlEng:"Owns prompts, graph flow, and eval test suites in LangSmith",platform:"Hosts deployment clusters & container runtimes",security:"Audits LangSmith data retention and sanitization",bizDev:"Uses Fleet/Playground to prototype without writing code"},invariants:{inf:{invariantId:"inf",stance:"commoditized",stanceLabel:"Bring-Your-Own Provider",detail:"Provider-agnostic by design. Wraps OpenAI, Anthropic, Gemini, or vLLM identically behind unified client interfaces.",strategicImplication:"Prevents vendor lock-in to any single model vendor, allowing instant routing to cheaper/faster models."},ctx:{invariantId:"ctx",stance:"absent",stanceLabel:"Outsourced to Data Layer",detail:"Contains no native understanding of business tables, metrics, or semantic modeling. Relies entirely on external RAG or vector indexes.",strategicImplication:"Leaves a massive blind spot: an agent can have flawless trace telemetry while hallucinating on bad table definitions."},act:{invariantId:"act",stance:"first-class",stanceLabel:"In-Code Graph Tools",detail:"Tools are defined as code functions inside the agent graph with optional human-in-the-loop approval interrupts.",strategicImplication:"Flexible for developers, but lacks enterprise-wide RBAC and cryptographic agent identity delegation out of the box."},rec:{invariantId:"rec",stance:"first-class",stanceLabel:"The Core Gravitational Anchor",detail:"The trace span hierarchy is the primary system of record. Every prompt, token, latency spike, and intermediate state is captured.",strategicImplication:"High lock-in. Once your team builds CI regression gates against historical traces, moving platforms is agonizing."},jud:{invariantId:"jud",stance:"first-class",stanceLabel:"Continuous Evals against Traces",detail:"Online and offline evaluations, LLM-as-a-judge scoring, pairwise comparisons, and dataset annotation workflows.",strategicImplication:`Directly addresses the enterprise deployment barrier: "How do we prove this update doesn't break edge cases?"`}}},{id:"shape-2",name:"Model Provider as Monolith",tagline:"The Agent Runtime Collapses Directly into the Model API",paradigm:"Full-stack vertical integration inside the frontier frontier",heroQuote:'"Why assemble 8 external services when OpenAI/Anthropic/Bedrock provides built-in tools, memory, retrieval, reasoning tokens, and execution?"',exemplars:["OpenAI Assistants & Responses API","Anthropic Computer Use & Messages","AWS Bedrock Agent Runtime","Google Vertex AI Agent Space"],runtimeStance:"The runtime is inside the inference request. The model loops internally across thoughts, tools, and outputs.",missingHole:"Cross-vendor portability is zero. Your system of record is trapped inside one provider's proprietary perimeter.",whyTheyWin:"Lowest friction, zero infrastructure to deploy, and prompt-caching / latency benefits from co-locating compute and state.",whyTheyFail:"Enterprises refuse to hand their entire governance, eval history, and multi-model leverage to a single closed provider.",artifactProduced:"Provider Thread / Session ID (thread_xxx inside closed cloud infrastructure).",ownershipProfile:{mlEng:"Configures provider system prompts and file attachments",platform:"Manages cloud billing and API quotas",security:"Reviews provider SOC2/HIPAA compliance agreements",bizDev:"Directly uses provider web interfaces and assistants"},invariants:{inf:{invariantId:"inf",stance:"first-class",stanceLabel:"The Core Proprietary Engine",detail:"Proprietary reasoning tokens, native tool-use token heads, and internal multi-token prediction optimizations.",strategicImplication:"Best-in-class reasoning performance, but you cannot mix-and-match models without rewriting integrations."},ctx:{invariantId:"ctx",stance:"bundled",stanceLabel:"In-Platform Vector & Files Store",detail:"Native file uploads, assistants vector stores, and provider-managed memory threads (e.g. OpenAI Vector Store).",strategicImplication:"Convenient to initialize, but disconnected from your corporate dbt semantic models and Git version control."},act:{invariantId:"act",stance:"bundled",stanceLabel:"Hosted Provider Tooling",detail:"Hosted code interpreters, file search, web search, and webhook triggers executed within the provider sandbox.",strategicImplication:"Sandboxed execution is maintained for you, but enterprise on-prem tool integration requires custom bridges."},rec:{invariantId:"rec",stance:"commoditized",stanceLabel:"Provider Console Logs",detail:"Logs exist within the cloud dashboard (Bedrock CloudWatch / OpenAI dashboard) with standard retention policies.",strategicImplication:"Telemetry is fragmented if you ever call a second provider or run local models."},jud:{invariantId:"jud",stance:"bundled",stanceLabel:"Single-Vendor Evaluators",detail:"Built-in evaluation dashboards and prompt playgrounds tied to that specific provider’s model generations.",strategicImplication:"Conflict of interest: the provider evaluates their own model’s quality without independent cross-validation."}}},{id:"shape-3",name:"Durable Execution & Workflow Engine",tagline:"There is No Agent Runtime — Agents are Just Fault-Tolerant Distributed Workflows",paradigm:"Replayable DAGs, event-driven state machines, durable queues",heroQuote:`"Long-running stateful workflows with retries, timeouts, and human approvals were solved a decade ago. Don't reinvent a worse version in Python."`,exemplars:["Temporal.io","Restate.dev","DBOS","Inngest","Cadence"],runtimeStance:"Temporal / Restate event histories. The agent loop is a deterministic workflow; LLM calls are flaky activities with exponential backoffs.",missingHole:"Semantic Judgment & Context Evals are completely foreign concepts — the engine only cares about distributed systems resilience.",whyTheyWin:"Rock-solid reliability for multi-day, multi-step asynchronous processes (e.g., loan approvals, compliance audits, background research).",whyTheyFail:"Building prompt evaluation pipelines, semantic similarity assertions, or conversational playgrounds on Temporal requires hand-rolling everything.",artifactProduced:"The Replayable Workflow Event History (deterministic event stream).",ownershipProfile:{mlEng:"Writes activity worker handlers calling model APIs",platform:"Deploys Temporal clusters, Kafka streams, and Postgres event storage",security:"Enforces VPC boundaries and mTLS between workers",bizDev:"Has no direct access; works through business workflow dashboards"},invariants:{inf:{invariantId:"inf",stance:"commoditized",stanceLabel:"Flaky Network Activity",detail:"Inference is simply an untrusted remote I/O call wrapped in retry policies, rate limiters, and circuit breakers.",strategicImplication:"Total resilience against provider downtime or 503 rate limits, with deterministic replay on crash."},ctx:{invariantId:"ctx",stance:"absent",stanceLabel:"Externalized Data Payload",detail:"No opinion on context, RAG, or embeddings; context is just a serializable payload passed to the workflow input.",strategicImplication:"Must be integrated with a separate data platform or vector database for grounding."},act:{invariantId:"act",stance:"first-class",stanceLabel:"Durable Activities with Human Signals",detail:"Tools are durable activities with idempotency keys, automatic compensation logic (sagas), and external pause/resume signals.",strategicImplication:"Unmatched guarantees for real-world financial or enterprise actions where duplicate execution causes disaster."},rec:{invariantId:"rec",stance:"first-class",stanceLabel:"Deterministic Event Sourcing",detail:"Every single event, activity completion, timer, and retry is permanently recorded in the durable workflow history.",strategicImplication:"Zero state loss even if the host server dies mid-execution; workflows resume on another node seamlessly."},jud:{invariantId:"jud",stance:"absent",stanceLabel:"No Notion of Semantic Quality",detail:"The engine verifies if an activity succeeded with HTTP 200, not whether the generated text was truthful, coherent, or biased.",strategicImplication:"Requires a secondary eval layer (like Braintrust or custom pytest fixtures) to test output validity."}}},{id:"shape-4",name:"Context & Data Intelligence Plane",tagline:"Agent Quality is 90% Data Modeling, Metric Definitions & Trust Signals",paradigm:"Semantic layers, metadata endorsements, workspace guides",heroQuote:'"An agent without business context will generate SQL that executes with 0 syntax errors and answers the exact wrong question."',exemplars:["dbt Labs (Semantic Layer)","Hex (Context Studio & Guides)","LlamaIndex","Cube.js","Atlan"],runtimeStance:"Hex agent threads, notebook environments, or embedded BI bots querying the semantic model.",missingHole:"Complex autonomous multi-step tool loops (e.g. browsing the web, operating terminal shells, running background code) are out of scope.",whyTheyWin:"Solves the #1 cause of enterprise AI failure: hallucinating metrics, joining uncurated tables, and misinterpreting ARR vs MRR.",whyTheyFail:"Cannot serve as a general-purpose agent runtime for non-data tasks (e.g., customer support bots, code editing, browser automation).",artifactProduced:"The Semantic Model & Endorsement Manifest (semantic_manifest.json + dbt models).",ownershipProfile:{mlEng:"Consumes curated data models via semantic layer APIs",platform:"Maintains Snowflake/BigQuery warehouse compute",security:"Enforces row/column level data masking in the warehouse",bizDev:"Directly asks questions in Hex or Slack and gets validated charts"},invariants:{inf:{invariantId:"inf",stance:"commoditized",stanceLabel:"Swappable SQL/Text Generator",detail:"The model is an interchangeable translation engine. Any good reasoning model can generate SQL if the context is pristine.",strategicImplication:"Protects the enterprise from model churn; your competitive moat is your proprietary business logic, not OpenAI weights."},ctx:{invariantId:"ctx",stance:"first-class",stanceLabel:"The Entire Value Proposition",detail:"dbt column definitions with business filtering rules, metric dimensions, table grains, Hex workspace guides, and verified endorsements.",strategicImplication:"Transforms raw table chaos into deterministic answers. If context is clear, even smaller cheap models succeed."},act:{invariantId:"act",stance:"commoditized",stanceLabel:"Read-Only Analytical Queries",detail:"Actions are primarily analytical queries executed against warehouse query engines, with strict read-only safety.",strategicImplication:"Safe for enterprise rollout because agents cannot accidentally mutate productio
